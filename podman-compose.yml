services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: local_agent
      POSTGRES_PASSWORD: local_agent
      POSTGRES_DB: local_agent
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core

  api:
    build:
      context: .
      dockerfile: deploy/Containerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ENVIRONMENT: development
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://llm-proxy:8080}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      llm-proxy:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - core
      - edge

  llm-proxy:
    build:
      context: .
      dockerfile: deploy/Containerfile.llm-proxy
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://local-model:8080/v1}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      local-model:
        condition: service_started
    networks:
      - core

  gui:
    build:
      context: .
      dockerfile: deploy/Containerfile.gui
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - edge

  local-model:
    build:
      context: .
      dockerfile: deploy/Containerfile.local-model
    environment:
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 3g
    cpus: 6
    user: "10001:10001"
    volumes:
      - local-model-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8090:8080"
    networks:
      - core

networks:
  core:
  edge:

volumes:
  db-data:
  local-model-cache:
