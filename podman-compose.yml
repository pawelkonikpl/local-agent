services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: local_agent
      POSTGRES_PASSWORD: local_agent
      POSTGRES_DB: local_agent
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core

  api:
    build:
      context: .
      dockerfile: deploy/Containerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ENVIRONMENT: development
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://llm-proxy:8080}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
      WEB_AGENT_URL: ${WEB_AGENT_URL:-http://web-agent:8080}
    depends_on:
      db:
        condition: service_healthy
      llm-proxy:
        condition: service_started
      web-agent:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - core
      - edge
      - web

  llm-proxy:
    build:
      context: .
      dockerfile: deploy/Containerfile.llm-proxy
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://local-model:8080/v1}
      # Recorded as the model in token_usage; same knob as local-model's LLAMA_ARG_HF_REPO.
      LOCAL_MODEL_ID: ${LOCAL_MODEL_HF_REPO:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      local-model:
        condition: service_started
    networks:
      - core

  gui:
    build:
      context: .
      dockerfile: deploy/Containerfile.gui
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - edge

  local-model:
    build:
      context: .
      dockerfile: deploy/Containerfile.local-model
    # llama-server is configured entirely through LLAMA_ARG_* env vars (see `llama-server --help`).
    environment:
      LLAMA_API_KEY: ${INTERNAL_PROXY_TOKEN}
      # Downloaded from Hugging Face into the cache volume on first start (~2.7GB).
      LLAMA_ARG_HF_REPO: ${LOCAL_MODEL_HF_REPO:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      LLAMA_ARG_ALIAS: ${LOCAL_MODEL_HF_REPO:-unsloth/Qwen3.5-4B-GGUF:Q4_K_M}
      # Qwen3.5 GGUFs ship a vision projector; text-only here, so don't download/load it.
      LLAMA_ARG_MMPROJ_AUTO: "false"
      # Qwen3.5 thinks by default -- far too slow on CPU for chat, so answer directly.
      LLAMA_ARG_REASONING: "off"
      # Qwen3.5's recommended non-thinking sampling; requests from llm-proxy don't set their own.
      LLAMA_ARG_TEMPERATURE: "0.7"
      LLAMA_ARG_TOP_P: "0.8"
      LLAMA_ARG_TOP_K: "20"
      LLAMA_ARG_PRESENCE_PENALTY: "1.5"
      # Keeps RAM bounded under mem_limit: a single slot, a 16k context (the model's native 262k
      # would be sized upfront) and a small prompt cache (default 8GB).
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_CACHE_RAM: "256"
      LLAMA_ARG_THREADS: "6"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 6g
    cpus: 6
    user: "10001:10001"
    volumes:
      - local-model-cache:/home/appuser/.cache/huggingface
    healthcheck:
      # 503 while the model is still downloading/loading, 200 once it can serve.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    ports:
      - "8090:8080"
    networks:
      - core

  # A browser with internet access: only on `web` (shared with `api`), never on `core`, so it
  # can't reach `db` or `llm-proxy`.
  web-agent:
    build:
      context: .
      dockerfile: deploy/Containerfile.web-agent
    environment:
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
      WEB_AGENT_CDP_URL: ${WEB_AGENT_CDP_URL:-}
      # DuckDuckGo blocks a headless browser, so in compose the browser searches our own SearXNG.
      WEB_AGENT_ENGINE: ${WEB_AGENT_ENGINE:-searxng}
      WEB_AGENT_SEARXNG_URL: http://searxng:8080
    depends_on:
      - searxng
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    shm_size: 256m
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8091:8080"
    networks:
      - web

  # Private metasearch engine: it queries the public engines (Brave, Google, Wikipedia, ...) and
  # web-agent's browser reads its results page. Only on `web`.
  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-searxng-secret-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro,Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    ports:
      - "8092:8080"
    networks:
      - web

networks:
  core:
  edge:
  web:

volumes:
  db-data:
  local-model-cache:
