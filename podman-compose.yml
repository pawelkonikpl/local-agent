services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: local_agent
      POSTGRES_PASSWORD: local_agent
      POSTGRES_DB: local_agent
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - core

  api:
    build:
      context: .
      dockerfile: deploy/Containerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ENVIRONMENT: development
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://llm-proxy:8080}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
      WEB_AGENT_URL: ${WEB_AGENT_URL:-http://web-agent:8080}
      # `site_search` through `site-agent` (a headful Chrome); set to "" to not offer the tool.
      WEB_AGENT_SITES_URL: ${WEB_AGENT_SITES_URL-http://site-agent:8080}
    depends_on:
      db:
        condition: service_healthy
      llm-proxy:
        condition: service_started
      web-agent:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - core
      - edge
      - web
      - sites

  llm-proxy:
    build:
      context: .
      dockerfile: deploy/Containerfile.llm-proxy
    environment:
      DATABASE_URL: postgresql+asyncpg://local_agent:local_agent@db:5432/local_agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - core

  gui:
    build:
      context: .
      dockerfile: deploy/Containerfile.gui
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - edge

  # A browser reading the web: only on `web` (shared with `api`), never on `core`, so it can't
  # reach `db` or `llm-proxy`. `web` has no route out; the browser's only way to the internet is
  # `egress-proxy`, which passes just the hosts in deploy/egress-proxy/allowlist.txt.
  web-agent:
    build:
      context: .
      dockerfile: deploy/Containerfile.web-agent
    environment:
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
      WEB_AGENT_CDP_URL: ${WEB_AGENT_CDP_URL:-}
      # DuckDuckGo blocks a headless browser, so in compose the browser searches our own SearXNG.
      WEB_AGENT_ENGINE: ${WEB_AGENT_ENGINE:-searxng}
      WEB_AGENT_SEARXNG_URL: http://searxng:8080
      WEB_AGENT_PROXY_URL: http://egress-proxy:3128
      # Our own SearXNG is reached directly on `web`, not through the proxy.
      WEB_AGENT_PROXY_BYPASS: searxng
    depends_on:
      - searxng
      - egress-proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    shm_size: 256m
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No host port: `web` is internal, so a published port wouldn't be forwarded anyway. From the
    # host, run web-agent itself (`uv run uvicorn web_agent.main:app --port 8091`) or use its CLI.
    networks:
      - web

  # The allowlisting forward proxy in front of web-agent's browser (tinyproxy, host filter,
  # default deny). On `web` to be reachable, on `egress` to get out.
  egress-proxy:
    build:
      context: .
      dockerfile: deploy/Containerfile.egress-proxy
    read_only: true
    tmpfs:
      - /tmp
      - /run/tinyproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - web
      - sites
      - egress

  # `site_search`'s browser: a real, headful Google Chrome on a virtual screen, driven over CDP by
  # web-agent in sites-only mode (no /v1/search here). Only on `sites`: the headless web-agent
  # can't reach it, and its way out is egress-proxy's allowlist. linux/amd64 only (Google Chrome).
  site-agent:
    build:
      context: .
      dockerfile: deploy/Containerfile.site-agent
    environment:
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN}
      WEB_AGENT_CDP_URL: http://127.0.0.1:9222
      WEB_AGENT_SITES_ONLY: "true"
      WEB_AGENT_REUSE_DEFAULT_CONTEXT: "true"
      SITE_BROWSER_PROXY: http://egress-proxy:3128
    depends_on:
      - egress-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    shm_size: 512m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sites

  # The site-agent browser's screen for a person (http://localhost:6080), to solve a bot check.
  # A published port needs a network with a way out, hence `site-vnc-out`, shared with no one.
  site-vnc:
    build:
      context: .
      dockerfile: deploy/Containerfile.site-vnc
    depends_on:
      - site-agent
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:6080:6080"
    networks:
      - sites
      - site-vnc-out

  # Private metasearch engine: it queries the public engines (Brave, Google, Wikipedia, ...) and
  # web-agent's browser reads its results page. On `web` for web-agent, on `egress` to get out.
  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-searxng-secret-change-me}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro,Z
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    ports:
      - "8092:8080"
    networks:
      - web
      - egress

networks:
  core:
  edge:
  # No route out of the host: what's on it reaches the internet only via a service also on `egress`.
  web:
    internal: true
  # site-agent's network: api, egress-proxy and site-vnc only (not the headless web-agent).
  sites:
    internal: true
  egress:
  site-vnc-out:

volumes:
  db-data:
