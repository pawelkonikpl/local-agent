server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Exact match: POST/GET /sessions (list/create). "/sessions/{id}" itself is a GUI page
    # route (no such bare API endpoint exists), so it must fall through to the SPA below.
    location = /sessions {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/sessions/[^/]+/messages$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # SSE: stream chat deltas to the browser as they arrive instead of buffering the
        # whole response, and don't let a long-lived stream hit nginx's read timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
