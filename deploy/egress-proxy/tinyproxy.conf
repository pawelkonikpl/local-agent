# web-agent's only way to the internet: a forward proxy that refuses every host not listed in
# allowlist.txt. The browser sends all its traffic here (WEB_AGENT_PROXY_URL); the `web` network
# itself has no route out.
# Runs as `nobody` (USER in the Containerfile), so no User/Group switching here.
Port 3128
Listen 0.0.0.0
Timeout 60
MaxClients 50
LogLevel Connect
# Hosts are matched with shell-style patterns, one per line: `allegro.pl` (that host only),
# `*.allegro.pl` (its subdomains). No URL paths: filtering is by host.
Filter "/etc/tinyproxy/allowlist.txt"
FilterType fnmatch
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
# HTTPS goes through CONNECT; allow only the standard port.
ConnectPort 443
DisableViaHeader Yes
XTinyproxy No
