[project]
name = "llm-proxy"
version = "0.1.0"
description = "local-agent llm-proxy: metered streaming forwarder in front of api.anthropic.com"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic-settings>=2.6",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_proxy"]
