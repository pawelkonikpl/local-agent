[project]
name = "web-agent"
version = "0.1.0"
description = "local-agent web-agent: CDP-driven browser Solver behind the model's web tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "playwright>=1.50",
    "tldextract>=5.1",
    "contracts",
]

[tool.uv.sources]
contracts = { workspace = true }

[project.scripts]
web-agent = "web_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_agent"]
