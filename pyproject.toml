[tool.uv.workspace]
members = ["services/api", "services/llm-proxy", "services/web-agent", "libs/shared"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/llm-proxy/tests", "services/web-agent/tests"]
asyncio_mode = "auto"
markers = ["browser: needs a local Chromium (uv run playwright install chromium); skipped otherwise"]
