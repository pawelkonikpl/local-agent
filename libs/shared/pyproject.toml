[project]
name = "shared"
version = "0.1.0"
description = "local-agent shared SQLAlchemy table definitions (owned migrations stay in services/api)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
